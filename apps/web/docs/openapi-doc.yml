    /api/typing:
        post:
            tags: [Presence]
            summary: Set the caller's typing state
            description: >-
                Upserts a typing presence record. The user is resolved from the
                session and the presence id is derived from that session, so a
                client can never write another user's typing state.
            security:
                - sessionCookie: []
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [channelId, typing]
                            properties:
                                channelId:
                                    type: string
                                typing:
                                    type: boolean
            responses:
                "200":
                    description: Typing state stored
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [success, presence]
                                properties:
                                    success:
                                        type: boolean
                                    presence:
                                        $ref: "#/components/schemas/StatusDocument"
                "400":
                    description: Invalid typing payload
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "500":
                    description: Failed to store typing state
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

        delete:
            tags: [Presence]
            summary: Clear the caller's typing state
            security:
                - sessionCookie: []
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [channelId]
                            properties:
                                channelId:
                                    type: string
            responses:
                "200":
                    description: Typing state cleared
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Success"
                "400":
                    description: channelId is required
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "500":
                    description: Failed to clear typing state
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

    /api/upload-image:
        post:
            tags: [Uploads]
            summary: Upload an image for message use
            security:
                - sessionCookie: []
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                file:
                                    type: string
                                    format: binary
            responses:
                "200":
                    description: Image uploaded
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    fileId:
                                        type: string
                                    fileUrl:
                                        type: string
                                        format: uri
                                required: [fileId, fileUrl]
                "400":
                    description: Invalid upload request (missing file, unsupported type, or malformed body)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: Forbidden - request origin is not allowed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "413":
                    description: File too large
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "429":
                    description: Too many upload requests
                    headers:
                        Retry-After:
                            schema:
                                type: integer
                            description: Seconds until another upload attempt is allowed.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        delete:
            tags: [Uploads]
            summary: Delete an uploaded image
            security:
                - sessionCookie: []
                - bearerAuth: []
            parameters:
                - name: fileId
                  in: query
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: Image deleted
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Success"
                "400":
                    description: Missing or invalid fileId
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: Forbidden - request origin is not allowed or caller does not own the file
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: Image not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "429":
                    description: Too many delete requests
                    headers:
                        Retry-After:
                            schema:
                                type: integer
                            description: Seconds until another delete attempt is allowed.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"

