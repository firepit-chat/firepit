                "200":
                    description: Poll state
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    poll:
                                        $ref: "#/components/schemas/MessagePoll"
                "500":
                    description: Failed to fetch poll
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"


    /api/messages/{messageId}/poll-votes:
        post:
            tags: [Messages]
            summary: Cast or change a poll vote
            description: >-
                Records the caller's vote for one option, replacing any previous
                vote they had cast on the same poll.
            security:
                - sessionCookie: []
                - bearerAuth: []
            parameters:
                - name: messageId
                  in: path
                  required: true
                  description: Message carrying the poll.
                  schema:
                      type: string

            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [optionId]
                            properties:
                                optionId:
                                    type: string
            responses:
                "200":
                    description: Vote recorded
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    poll:
                                        $ref: "#/components/schemas/MessagePoll"
                "400":
                    description: Invalid option for this poll
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "404":
                    description: Poll not found or already closed
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"


    /api/messages/{messageId}/poll/close:
        post:
            tags: [Messages]
            summary: Close a poll
            x-roles:
                - poll creator
                - server member with manageMessages
            description: Closes an open poll so no further votes are accepted.
            security:
                - sessionCookie: []
                - bearerAuth: []
            parameters:
                - name: messageId
                  in: path
                  required: true
                  description: Message carrying the poll.
                  schema:
                      type: string

            responses:
                "200":
                    description: Poll closed
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    poll:
                                        $ref: "#/components/schemas/MessagePoll"
                "400":
                    description: Poll is already closed or the caller may not close it
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "404":
                    description: Poll not found
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

