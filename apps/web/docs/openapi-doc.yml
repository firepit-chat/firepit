    /api/reports:
        post:
            tags: [Moderation]
            summary: Report a user
            description: >-
                Files a moderation report against another user. Rate limited,
                and rejected as a conflict when the caller has already reported
                that user for the same reason.
            security:
                - sessionCookie: []
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [targetUserId, justification]
                            properties:
                                targetUserId:
                                    type: string
                                justification:
                                    type: string
                                    minLength: 10
                                    maxLength: 1000
            responses:
                "200":
                    description: Report filed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Success"
                "400":
                    description: Invalid target or justification outside the allowed length
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "409":
                    description: You have already reported this user
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "429":
                    description: Too many reports. Rate limited.
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "500":
                    description: Failed to file report
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"


    /api/moderation/messages/{messageId}:
        post:
            tags: [Moderation]
            summary: Apply a moderation action to a message
            x-roles:
                - global moderator or admin
                - server owner
                - server member with manageMessages or administrator
            description: >-
                Soft-deletes, restores, or permanently deletes a message. The
                shared moderation layer enforces the permission check, applies
                rate limiting, and writes an audit event.
            security:
                - sessionCookie: []
                - bearerAuth: []
            parameters:
                - name: messageId
                  in: path
                  required: true
                  description: Message to moderate.
                  schema:
                      type: string

            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [action]
                            properties:
                                action:
                                    type: string
