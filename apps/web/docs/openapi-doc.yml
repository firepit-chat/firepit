    /api/announcements:
        get:
            tags: [Announcements]
            summary: List instance announcements
            description: Returns announcements visible to the caller, optionally filtered by status.
            security:
                - sessionCookie: []
                - bearerAuth: []
            parameters:
                - name: statuses
                  in: query
                  required: false
                  description: >-
                      Comma-separated statuses to include. Unknown values are
                      ignored. One of draft, scheduled, dispatching, sent,
                      failed, archived.
                  schema:
                      type: string
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                - name: cursorAfter
                  in: query
                  required: false
                  schema:
                      type: string
            responses:
                "200":
                    description: Announcement page
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AnnouncementListResponse"
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "500":
                    description: Failed to list announcements
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

        post:
            tags: [Announcements]
            summary: Create an instance announcement
            x-roles:
                - instance admin
            description: >-
                Creates an announcement as a draft, schedules it for a future
                time, or sends it immediately. Pass an idempotencyKey to make
                retries safe.
            security:
                - sessionCookie: []
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [title, body, mode]
                            properties:
                                title:
                                    type: string
                                    maxLength: 255
                                body:
                                    type: string
                                    maxLength: 65000
                                mode:
                                    type: string
                                    enum: [draft, schedule, send_now]
                                priority:
                                    type: string
                                    enum: [normal, urgent]
                                    default: normal
                                scheduledFor:
                                    type: string
                                    format: date-time
                                    description: Required when mode is schedule.
                                status:
                                    type: string
                                    description: Explicit target status; normally derived from mode.
                                trim:
                                    type: boolean
                                idempotencyKey:
                                    type: [string, "null"]
                                    description: Client-generated key that makes retries safe.
            responses:
                "200":
                    description: Announcement created
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [success, announcement]
                                properties:
                                    success:
                                        type: boolean
                                    announcement:
                                        $ref: "#/components/schemas/Announcement"
                "400":
                    description: Invalid announcement payload
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "500":
                    description: Failed to create announcement
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"


    /api/announcements/dispatch:
        post:
            tags: [Announcements]
            summary: Dispatch due announcements
            description: >-
                Service-to-service endpoint invoked on a schedule. Leases due
                scheduled announcements, fans out deliveries, and records the
                outcome. Authenticated with a shared secret header rather than a
                user session, so it is intentionally not part of the user-facing
                API.
            security: []
            parameters:
                - name: limit
                  in: query
                  required: false
                  description: Maximum announcements to dispatch in this run.
                  schema:
                      type: integer
                - name: x-announcements-dispatcher-secret
                  in: header
                  required: true
                  description: Shared secret configured on the instance.
                  schema:
                      type: string
            responses:
                "200":
                    description: Dispatch run completed
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [success, dispatched]
                                properties:
                                    success:
                                        type: boolean
                                    dispatched:
                                        type: integer
                                    announcementIds:
                                        type: array
                                        items:
                                            type: string
                "401":
                    description: Dispatcher secret missing or incorrect
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "500":
                    description: Dispatch run failed
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "503":
                    description: Dispatcher secret is not configured on this instance
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

