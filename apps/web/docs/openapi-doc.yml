    /api/gifs/search:
        get:
            tags: [Search]
            summary: Search GIFs
            description: >-
                Proxies a search to the configured GIF provider (Giphy by
                default) and normalizes the results, so the API key is never
                exposed to clients. Requires the instance to have a GIF provider
                configured.
            security:
                - sessionCookie: []
                - bearerAuth: []
            parameters:
                - name: q
                  in: query
                  required: true
                  description: Search terms.
                  schema:
                      type: string
                - name: limit
                  in: query
                  required: false
                  description: Results per page. Clamped to 1-30, defaults to 20.
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 30
                - name: cursor
                  in: query
                  required: false
                  description: Opaque pagination cursor from a previous page.
                  schema:
                      type: string
            responses:
                "200":
                    description: GIF search results
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                id:
                                                    type: string
                                                url:
                                                    type: string
                                                previewUrl:
                                                    type: string
                                                width:
                                                    type: integer
                                                height:
                                                    type: integer
                                    nextCursor:
                                        type: [string, "null"]
                "400":
                    description: q is required
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "429":
                    description: Rate limited by the upstream provider
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "502":
                    description: Upstream provider returned an error
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "503":
                    description: No GIF provider configured
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"

                "504":
                    description: Upstream provider timed out
                    content:
                        application/json:
                            schema:
                            $ref: "#/components/schemas/Error"


