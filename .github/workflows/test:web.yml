name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.0"

            - name: Install dependencies
              run: bun install

            - name: Build workspace packages
              # `next build`, the typechecker and the test suites all resolve
              # workspace packages through their `exports`, which point at
              # `dist/`. That output is gitignored, so it has to exist first —
              # otherwise the app tests fail to resolve their imports.
              run: bunx turbo run build --filter='./packages/*'

            - name: Validate environment
              working-directory: apps/web
              run: bun run validate-env:ci
              env:
                  NEXT_TELEMETRY_DISABLED: 1
                  APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
                  NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
                  APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
                  NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
                  APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}

            - name: Run tests
              working-directory: apps/web
              run: bun run test
              env:
                  NEXT_TELEMETRY_DISABLED: 1
                  APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
                  NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
                  APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
                  NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
                  APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}

            - name: Run typecheck
              run: bun run typecheck

            - name: Run workspace package tests
              # Not covered by the repo-wide turbo scripts: each app runs its own
              # suite, so workspace packages under packages/ are tested here.
              run: bunx turbo run test --filter='./packages/*'

            - name: Check OpenAPI spec matches route handlers
              working-directory: apps/web
              run: bun run check:openapi

            - name: Check generated API types match the spec
              working-directory: apps/web
              run: bun run check:api-types

            - name: Run linter
              run: bun run lint

            # Typecheck does not compile CSS, and lint cannot see a Tailwind
            # scanner picking up a stray utility out of a comment — that class of
            # break passes every step above and only fails on deploy. This also
            # catches anything that only typechecks locally because a cached
            # .next is masking it.
            - name: Build
              working-directory: apps/web
              run: bun run build
              env:
                  NEXT_TELEMETRY_DISABLED: 1
                  APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
                  NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
                  APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
                  NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
                  APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
