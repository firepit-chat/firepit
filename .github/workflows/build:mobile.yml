name: Build Mobile APKs

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            MYAPP_UPLOAD_KEYSTORE: ${{ secrets.MYAPP_UPLOAD_KEYSTORE }}
            EXPO_UNSTABLE_TREE_SHAKING: "1"
            EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH: "1"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.0"

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Install dependencies
              run: bun install

            - name: Init EAS
              working-directory: apps/mobile
              run: EXPO_TOKEN=${{ secrets.EXPO_TOKEN }} bunx eas-cli init --non-interactive
            - name: Pull EAS Env
              working-directory: apps/mobile
              run: EXPO_TOKEN=${{ secrets.EXPO_TOKEN }} bunx eas-cli env:pull --non-interactive --environment production
            - name: Restore signing keystore
              if: ${{ env.MYAPP_UPLOAD_KEYSTORE != '' }}
              env:
                  MYAPP_UPLOAD_KEYSTORE: ${{ secrets.MYAPP_UPLOAD_KEYSTORE }}
              run: |
                  mkdir -p apps/mobile/credentials/android
                  echo "$MYAPP_UPLOAD_KEYSTORE" | base64 -d > apps/mobile/credentials/android/firepit-upload.keystore

            - name: Build arm64-v8a APK
              working-directory: apps/mobile
              run: bun scripts/build.ts --arch arm64-v8a
              env:
                  MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
                  MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
                  MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}

            - name: Build armeabi-v7a APK
              working-directory: apps/mobile
              run: bun scripts/build.ts --arch armeabi-v7a
              env:
                  MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
                  MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
                  MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}

            - name: Upload APKs
              uses: actions/upload-artifact@v4
              with:
                  name: firepit-android-apks
                  path: |
                      firepit-arm64-v8a.apk
                      firepit-armeabi-v7a.apk
